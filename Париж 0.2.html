<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Париж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#d4d6da;--ink:#1c1e22;--soft:#5d6269;--line:#8b9097;--rose:#9c4f57;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1e22;--ink:#dcdee2;--soft:#8b9097;--line:#4a4e55;--rose:#c27a82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1e22;--ink:#dcdee2;--soft:#8b9097;--line:#4a4e55;--rose:#c27a82;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.screen{width:100%;max-width:440px;padding:24px;text-align:center}
#gate h1{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:400;font-style:italic;margin:0 0 2rem;letter-spacing:.01em}
input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:1.6rem;text-align:center;padding:.4rem 0;outline:none;border-radius:0}
input:focus-visible{border-bottom-color:var(--ink)}
button{margin-top:1.8rem;background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:1.25rem;font-style:italic;padding:.55rem 2.2rem;cursor:pointer;border-radius:999px;transition:border-color .2s,background .2s}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#hint{min-height:2.2rem;margin:1.6rem 0 0;color:var(--rose);font-size:1.35rem;font-style:italic;opacity:0;transition:opacity .5s}
#hint.on{opacity:1}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#reveal{display:none;max-width:520px}
#reveal.on{display:block}
#reveal img{display:block;width:100%;height:auto;border-radius:2px;opacity:0;animation:fade 1.8s .1s forwards}
#reveal h2{font-size:clamp(2rem,8vw,3rem);font-weight:500;font-style:italic;margin:1.6rem 0 0;opacity:0;animation:fade 1.6s 1.4s forwards}
.choices{display:flex;gap:1rem;justify-content:center;margin-top:1.4rem}
.choices button{margin-top:0;min-width:7rem}
#ask .choices{opacity:0;animation:fade 1s 2.6s forwards}
#reveal [hidden]{display:none}
#reveal img.shown,#reveal h2.shown{opacity:1;animation:none}
#nope h2{margin:0}
#agree img{display:block;width:100%;height:auto;border-radius:2px}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}#reveal img,#reveal h2,#ask .choices{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<main class="screen" id="gate">
  <h1>введи пароль</h1>
  <input id="pw" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Пароль" autofocus>
  <div><button id="go" type="button">войти</button></div>
  <p id="hint" role="status" aria-live="polite">твое имя</p>
</main>

<script>
(function(){
  var pw=document.getElementById('pw'),go=document.getElementById('go'),hint=document.getElementById('hint'),
      gate=document.getElementById('gate'),reveal=document.getElementById('reveal'),tries=0;
  var ask=document.getElementById("ask"),nope=document.getElementById("nope"),agree=document.getElementById("agree");
  function show(el){ask.hidden=true;nope.hidden=true;agree.hidden=true;el.hidden=false;}
  document.getElementById("yes").addEventListener("click",function(){show(agree);});
  document.getElementById("no").addEventListener("click",function(){show(nope);});
  document.getElementById("back").addEventListener("click",function(){show(ask);});
  function check(){
    var v=pw.value.trim().toLowerCase();
    if(v==='дима'){
      gate.style.display='none';reveal.classList.add('on');return;
    }
    tries++;
    pw.value='';
    gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');
    if(tries>=1){hint.classList.add('on');}
    pw.focus();
  }
  go.addEventListener('click',check);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter'){check();}});
})();
</script>
